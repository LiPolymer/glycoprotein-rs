stages:
  - prepare
  - test
  - publish
  - release

.release_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^release: (0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$/'
    - when: never

release_metadata:
  extends: .release_rules
  stage: prepare
  image: rust:1.88
  script:
    - |
      set -eu

      if [ "${CI_COMMIT_MESSAGE_IS_TRUNCATED:-false}" = "true" ]; then
        echo "The release commit message was truncated; refusing to publish incomplete release notes." >&2
        exit 1
      fi

      release_version="${CI_COMMIT_TITLE#release: }"
      manifest_version="$(cargo pkgid | sed 's/.*@//')"

      if [ "$release_version" != "$manifest_version" ]; then
        echo "Release title version '$release_version' does not match Cargo.toml version '$manifest_version'." >&2
        exit 1
      fi

      printf 'RELEASE_VERSION=%s\n' "$manifest_version" > release.env
      printf 'RELEASE_TAG=v%s\n' "$manifest_version" >> release.env

      if printf '%s' "${CI_COMMIT_DESCRIPTION:-}" | grep -q '[^[:space:]]'; then
        printf '%s\n' "$CI_COMMIT_DESCRIPTION" > release-notes.md
      else
        printf 'No changelog was provided for v%s.\n' "$manifest_version" > release-notes.md
      fi
  artifacts:
    reports:
      dotenv: release.env
    paths:
      - release-notes.md
    expire_in: 1 week

rust:
  stage: test
  image: rust:1.88
  before_script:
    - rustup component add rustfmt clippy
    - cargo install cargo2junit --version 0.1.15 --locked
  script:
    - cargo fmt --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - |
      set +e
      RUSTC_BOOTSTRAP=1 cargo test --all-targets --all-features -- -Z unstable-options --format json --report-time | tee test-results.json
      test_status=${PIPESTATUS[0]}
      cargo2junit < test-results.json > junit.xml
      report_status=$?
      if [ "$report_status" -ne 0 ]; then
        exit "$report_status"
      fi
      exit "$test_status"
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
    expire_in: 1 week

publish_crates_io:
  extends: .release_rules
  stage: publish
  image: rust:1.88
  needs:
    - job: release_metadata
      artifacts: true
    - job: rust
      artifacts: false
  resource_group: crates-io-release
  environment:
    name: crates-io
  script:
    - |
      if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
        echo "CARGO_REGISTRY_TOKEN is not configured." >&2
        exit 1
      fi
    - cargo publish --dry-run --locked --registry crates-io
    - cargo publish --locked --registry crates-io

gitlab_release:
  extends: .release_rules
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: release_metadata
      artifacts: true
    - job: publish_crates_io
      artifacts: false
  script:
    - test -f release-notes.md
    - echo "Creating GitLab release $RELEASE_TAG for $CI_COMMIT_SHA"
  release:
    tag_name: '$RELEASE_TAG'
    tag_message: 'Release $RELEASE_TAG'
    name: 'Release $RELEASE_TAG'
    description: './release-notes.md'
    ref: '$CI_COMMIT_SHA'
