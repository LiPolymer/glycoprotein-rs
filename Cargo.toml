[package]
name = "glycoprotein"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
description = "A Rust peer for the Glycoprotein local IPC mesh"
readme = "README.md"
repository = "https://gitlab.com/LiPolymer/glycoprotein-rs"
homepage = "https://github.com/LiPolymer/glycoprotein-rs"
documentation = "https://docs.rs/glycoprotein"
keywords = ["ipc", "mesh", "async", "interop"]
categories = ["asynchronous", "network-programming"]
publish = ["crates-io"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
jsonschema = { version = "0.33.0", default-features = false }
schemars = { version = "1.0.4", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
socket2 = { version = "0.6.1", features = ["all"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.23.0"
